[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA Fallback Routing for React
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Enforce Correct MIME Types for JavaScript Modules on Netlify
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    X-Content-Type-Options = "nosniff"
